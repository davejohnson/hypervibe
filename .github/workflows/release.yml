name: Publish Hypervibe Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: hypervibe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-package:
    name: Validate npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          check-latest: true
          cache: npm

      - name: Set up Go for Fly.io private networking helper
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: native/fly-wireguard-proxy/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$expected_version" != "$package_version" ]]; then
            echo "Tag version $expected_version does not match package version $package_version."
            exit 1
          fi

      - name: Validate release package
        run: npm run release:check

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          check-latest: true
          cache: npm

      - name: Set up Go for Fly.io private networking helper
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: native/fly-wireguard-proxy/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Test macOS companion
        run: swift test --package-path apps/macos

      - name: Configure Developer ID signing and notarization
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: ./scripts/configure-macos-release-signing.sh

      - name: Build macOS installer
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/build-macos-installer.sh

      - name: Create checksum
        shell: bash
        run: |
          artifact="$(find build/macos -maxdepth 1 -type f -name 'Hypervibe-*-${{ matrix.arch }}.dmg' -print -quit)"
          if [[ -z "$artifact" ]]; then
            echo "No ${{ matrix.arch }} DMG was produced." >&2
            exit 1
          fi
          artifact_dir="$(dirname "$artifact")"
          artifact_name="$(basename "$artifact")"
          (
            cd "$artifact_dir"
            shasum -a 256 "$artifact_name" > "$artifact_name.sha256"
          )

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: Hypervibe-${{ matrix.arch }}
          path: |
            build/macos/Hypervibe-*-${{ matrix.arch }}.dmg
            build/macos/Hypervibe-*-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/hypervibe-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/hypervibe-developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8 \
            "$RUNNER_TEMP/hypervibe-signing.keychain-db"

  publish-package:
    name: Publish public npm package
    needs: [validate-package, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          check-latest: true
          registry-url: https://registry.npmjs.org
          scope: "@hypervibe"

      - name: Set up Go for Fly.io private networking helper
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: native/fly-wireguard-proxy/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.0

      - name: Publish public package with provenance
        run: npm publish --access public --provenance

  release:
    name: Publish GitHub Release
    needs: [publish-package, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS installers
        uses: actions/download-artifact@v7
        with:
          pattern: Hypervibe-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          expected=(
            "release-assets/Hypervibe-${GITHUB_REF_NAME#v}-arm64.dmg"
            "release-assets/Hypervibe-${GITHUB_REF_NAME#v}-arm64.dmg.sha256"
            "release-assets/Hypervibe-${GITHUB_REF_NAME#v}-x86_64.dmg"
            "release-assets/Hypervibe-${GITHUB_REF_NAME#v}-x86_64.dmg.sha256"
          )
          for artifact in "${expected[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "Missing release asset: $artifact" >&2
              exit 1
            fi
          done
          (
            cd release-assets
            sha256sum --check *.dmg.sha256
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Hypervibe ${GITHUB_REF_NAME#v}"
