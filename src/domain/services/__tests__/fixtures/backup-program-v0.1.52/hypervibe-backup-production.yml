# Managed by Hypervibe. Change desired state with hv_spec.
name: Hypervibe backups (production)
on:
  schedule:
    - cron: 17 3 * * *
    - cron: 47 * * * *
  workflow_dispatch:
    inputs:
      operation:
        description: Create a retained recovery set or inspect its health
        type: choice
        required: true
        default: health
        options:
          - backup
          - health
permissions:
  contents: read
concurrency:
  group: hypervibe-deploy-production
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run managed backup controller
        shell: bash
        env:
          HYPERVIBE_BACKUP_RUNNER_IMAGE: ghcr.io/acme/backup@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          HYPERVIBE_BACKUP_CONTRACT_HASH: e73afe752b28643c7721660166617f64fa97f9663d97525762a073e780a1331e
          HYPERVIBE_BACKUP_TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          HYPERVIBE_BACKUP_INPUT_OPERATION: ${{ inputs.operation }}
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          IMAGE_REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          IMAGE_REGISTRY_TOKEN: ${{ secrets.IMAGE_REGISTRY_TOKEN }}
        run: |-
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            schedule)
              case "$HYPERVIBE_BACKUP_TRIGGER_SCHEDULE" in
                "17 3 * * *") export HYPERVIBE_BACKUP_OPERATION=backup ;;
                "47 * * * *") export HYPERVIBE_BACKUP_OPERATION=health ;;
                *) exit 1 ;;
              esac ;;
            workflow_dispatch)
              case "$HYPERVIBE_BACKUP_INPUT_OPERATION" in backup|health) export HYPERVIBE_BACKUP_OPERATION="$HYPERVIBE_BACKUP_INPUT_OPERATION" ;; *) exit 1 ;; esac ;;
            *) exit 1 ;;
          esac
          if [ "$HYPERVIBE_BACKUP_OPERATION" = backup ] && [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "An uncertain backup must be observed, not rerun. Dispatch health instead." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/hypervibe-backup-production"
          scratch="$(mktemp -d "$RUNNER_TEMP/hypervibe-backup-scratch.XXXXXX")"
          chmod 700 "$scratch"
          trap 'rm -rf -- "$scratch"' EXIT
          if [ -n "${IMAGE_REGISTRY_TOKEN:-}" ]; then
            test -n "${IMAGE_REGISTRY_USERNAME:-}"
            printf "%s" "$IMAGE_REGISTRY_TOKEN" | docker login "${HYPERVIBE_BACKUP_RUNNER_IMAGE%%/*}" --username "$IMAGE_REGISTRY_USERNAME" --password-stdin >/dev/null 2>&1
          fi
          docker run --rm --read-only --user "$(id -u):$(id -g)" --entrypoint node \
            --mount "type=bind,src=$scratch,dst=/tmp" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/.github/hypervibe/backups-production.json,dst=/input/contract.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/hypervibe-backup-production,dst=/output" \
            --env HYPERVIBE_BACKUP_CONTRACT=/input/contract.json --env HYPERVIBE_BACKUP_RECEIPT=/output/receipt.json \
            --env RAILWAY_API_TOKEN \
            --env GITHUB_TOKEN \
            --env GITHUB_REPOSITORY \
            --env GITHUB_SHA \
            --env GITHUB_REF \
            --env GITHUB_EVENT_NAME \
            --env GITHUB_RUN_ID \
            --env GITHUB_RUN_ATTEMPT \
            --env HYPERVIBE_BACKUP_OPERATION \
            --env HYPERVIBE_BACKUP_CONTRACT_HASH \
            --env HYPERVIBE_BACKUP_RUNNER_IMAGE \
            --env IMAGE_REGISTRY_USERNAME \
            --env IMAGE_REGISTRY_TOKEN \
            "$HYPERVIBE_BACKUP_RUNNER_IMAGE" /opt/hypervibe/dist/ci/backup-controller.js
      - name: Save safe backup receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hypervibe-backup-receipt-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hypervibe-backup-production/receipt.json
          if-no-files-found: ignore
          retention-days: 14
  alert:
    needs:
      - backup
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Load safe backup receipt
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: hypervibe-backup-receipt-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hypervibe-backup-production
      - name: Reconcile backup health alert
        uses: actions/github-script@v9
        env:
          HYPERVIBE_BACKUP_ENVIRONMENT: production
          HYPERVIBE_BACKUP_RECEIPT_PATH: ${{ runner.temp }}/hypervibe-backup-production/receipt.json
          HYPERVIBE_BACKUP_JOB_RESULT: ${{ needs.backup.result }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |-
            const fs = require('node:fs');
            const env = process.env.HYPERVIBE_BACKUP_ENVIRONMENT;
            if (!/^[a-zA-Z0-9_-]{1,96}$/.test(env || '')) throw new Error('Invalid backup alert scope.');
            const parseBackupOperationReceipt = function parseBackupOperationReceipt(value, rules) {
                const object = (item) => Boolean(item && typeof item === 'object' && !Array.isArray(item));
                const keys = (item, allowed) => Object.keys(item).every(key => allowed.includes(key));
                const count = (item) => Number.isSafeInteger(item) && item >= 0;
                if (!object(value) || !keys(value, ['version', 'environment', 'status', 'reasonCodes', 'counts', 'setId', 'completedAt', 'diagnostic'])
                    || ![1, 2].includes(value.version)
                    || typeof value.environment !== 'string' || !/^[a-zA-Z0-9_-]{1,96}$/.test(value.environment)
                    || !['healthy', 'unhealthy', 'unknown'].includes(value.status)
                    || !Array.isArray(value.reasonCodes) || value.reasonCodes.length > 24
                    || value.reasonCodes.some(code => typeof code !== 'string' || !rules.reasons.includes(code))
                    || (value.status === 'healthy' && (value.reasonCodes.length > 0 || value.diagnostic !== undefined)))
                    return undefined;
                if (value.setId !== undefined && (typeof value.setId !== 'string'
                    || !/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(value.setId)))
                    return undefined;
                if (value.completedAt !== undefined && (typeof value.completedAt !== 'string' || !Number.isFinite(Date.parse(value.completedAt))))
                    return undefined;
                let counts;
                if (value.counts !== undefined) {
                    if (!object(value.counts) || !keys(value.counts, ['applied', 'skipped'])
                        || !(value.counts.applied === null || count(value.counts.applied)) || !count(value.counts.skipped))
                        return undefined;
                    counts = { applied: value.counts.applied, skipped: value.counts.skipped };
                }
                let diagnostic;
                if (value.diagnostic !== undefined) {
                    const d = value.diagnostic;
                    if (value.version !== 2 || !object(d) || !keys(d, ['stage', 'category', 'httpStatus', 'localCleanupFailed', 'task'])
                        || !rules.stages.includes(d.stage) || !rules.categories.includes(d.category)
                        || (d.localCleanupFailed !== undefined && d.localCleanupFailed !== true)
                        || (d.httpStatus !== undefined && (!Number.isInteger(d.httpStatus) || d.httpStatus < 100 || d.httpStatus > 599)))
                        return undefined;
                    if (d.task !== undefined) {
                        const task = d.task;
                        if (!object(task) || !Object.keys(task).length || !keys(task, ['status', 'exitCode', 'mutationAttempted', 'cleanupVerified'])
                            || (task.status !== undefined && !['running', 'completed', 'failed', 'timeout'].includes(task.status))
                            || (task.exitCode !== undefined && (!Number.isInteger(task.exitCode) || task.exitCode < -2147483648 || task.exitCode > 2147483647))
                            || (task.mutationAttempted !== undefined && typeof task.mutationAttempted !== 'boolean')
                            || (task.cleanupVerified !== undefined && typeof task.cleanupVerified !== 'boolean'))
                            return undefined;
                    }
                    diagnostic = d;
                }
                return { version: value.version, environment: value.environment,
                    status: value.status, reasonCodes: value.reasonCodes,
                    ...(counts ? { counts } : {}), ...(diagnostic ? { diagnostic } : {}),
                    ...(value.setId === undefined ? {} : { setId: value.setId }),
                    ...(value.completedAt === undefined ? {} : { completedAt: value.completedAt }) };
            };
            const backupReceiptRules = {"stages":["input","authority","credentials","source-observation","credential-handoff","task-preflight","task-create","task-ownership","task-configure","task-deploy","task-observe","task-execution","task-cleanup","completion-record","retention","health","receipt-write","worker-input","archive-open","source-open","recovery-reservation","database-backup","database-restore","database-verification","object-copy","reference-verification","object-restore","restore-cleanup","recovery-completion","recovery-set"],"categories":["invalid-input","unsupported","authorization","schema","rate-limit","provider","invalid-response","timeout","execution","cleanup","unknown"],"reasons":["backup-missing","backup-stale","backup-unverified","restore-unverified","files-unverified","references-unverified","source-mismatch","destination-mismatch","retention-unknown","cleanup-unverified","scheduler-stale","execution-failed","observation-unavailable","receipt-missing","receipt-invalid"]};
            let status = 'unknown';
            let reasons = ['receipt-missing'];
            let diagnostic;
            try {
              const file = process.env.HYPERVIBE_BACKUP_RECEIPT_PATH;
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.size > 16384) throw new Error('Invalid receipt size.');
              const receipt = parseBackupOperationReceipt(JSON.parse(fs.readFileSync(file, 'utf8')), backupReceiptRules);
              if (!receipt || receipt.environment !== env) throw new Error('Invalid backup receipt.');
              status = receipt.status; reasons = receipt.reasonCodes; diagnostic = receipt.diagnostic;
            } catch { reasons = ['receipt-invalid']; }
            if (process.env.HYPERVIBE_BACKUP_JOB_RESULT !== 'success') { status = 'unknown'; reasons = [...new Set([...reasons, 'execution-failed'])]; }
            const marker = '<!-- hypervibe:backup-health:' + env + ' -->';
            const title = '[Hypervibe] Backup protection needs attention (' + env + ')';
            const base = 'https://api.github.com/repos/' + encodeURIComponent(context.repo.owner) + '/' + encodeURIComponent(context.repo.repo);
            const request = async (path, method, body) => {
              let response;
              try { response = await fetch(base + path, { method, headers: {
                Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'
              }, ...(body === undefined ? {} : { body: JSON.stringify(body) }) }); }
              catch { throw new Error('Backup alert API request failed.'); }
              if (!response.ok) throw new Error('Backup alert API request failed.');
              try { return await response.json(); } catch { throw new Error('Backup alert response is invalid.'); }
            };
            const alerts = [];
            for (let page = 1; ; page++) {
              if (page > 50) throw new Error('Backup alert inventory exceeded its bound.');
              const items = await request('/issues?state=open&per_page=100&page=' + page, 'GET');
              if (!Array.isArray(items)) throw new Error('Backup alert inventory is invalid.');
              for (const item of items) {
                if (!item.pull_request && item.user?.login === 'github-actions[bot]' && Number.isSafeInteger(item.number)
                  && typeof item.body === 'string' && item.body.split('\n')[0] === marker) alerts.push(item);
              }
              if (items.length < 100) break;
            }
            const run = 'https://github.com/' + encodeURIComponent(context.repo.owner) + '/' + encodeURIComponent(context.repo.repo) + '/actions/runs/' + context.runId;
            const body = marker + '\n\n' + (status === 'healthy' ? 'Current retained backup and restore evidence is healthy.'
              : 'Backup protection is ' + status + '. Reason codes: ' + (reasons.length ? reasons.join(', ') : 'observation-unavailable') + '.')
              + (diagnostic ? '\n\nStage: ' + diagnostic.stage + '; category: ' + diagnostic.category
                + (diagnostic.httpStatus === undefined ? '' : '; HTTP status: ' + diagnostic.httpStatus)
                + (diagnostic.localCleanupFailed ? '; local cleanup: failed' : '')
                + (diagnostic.task ? '; task: ' + JSON.stringify(diagnostic.task) : '') + '.' : '')
              + '\n\n[Inspect the managed recovery run](' + run + ').';
            let applied = 0; let skipped = 0;
            if (status === 'healthy') {
              for (const item of alerts) { await request('/issues/' + item.number, 'PATCH', { state: 'closed', body }); applied++; }
              if (alerts.length === 0) skipped++;
            } else if (alerts.length === 0) {
              await request('/issues', 'POST', { title, body }); applied++;
            } else {
              for (const item of alerts) {
                if (item.body === body && item.title === title) { skipped++; continue; }
                await request('/issues/' + item.number, 'PATCH', { state: 'open', title, body }); applied++;
              }
            }
            core.notice('Backup alert reconciliation: applied=' + applied + ', skipped=' + skipped + ', status=' + status);
            return { applied, skipped, status };
